<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>POS Bán Hàng - Moon Light</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/admin.css"> <style>
        /* CSS Riêng cho trang POS đè lên admin.css */
        body { overflow: hidden; } /* Chống cuộn toàn trang */
        .pos-layout { display: flex; height: 100vh; width: 100%; }
        
        /* CỘT TRÁI: DANH SÁCH SẢN PHẨM */
        .pos-left { flex: 1; padding: 20px; overflow-y: auto; background: var(--bg-body); border-right: 1px solid var(--border); }
        .pos-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .pos-search { width: 100%; max-width: 400px; position: relative; }
        .pos-search input { width: 100%; background: var(--bg-input); border: 1px solid #333; padding: 12px 40px 12px 15px; border-radius: 30px; color: #fff; }
        .pos-search i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #666; }
        
        .pos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .pos-product-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; cursor: pointer; transition: 0.2s; position: relative; }
        .pos-product-card:hover { transform: translateY(-3px); border-color: var(--gold); }
        .pos-card-img { height: 120px; width: 100%; object-fit: cover; }
        .pos-card-info { padding: 10px; }
        .pos-card-name { font-size: 11px; font-weight: 700; margin-bottom: 5px; height: 30px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .pos-card-price { color: var(--gold); font-weight: 700; font-size: 12px; }
        .pos-stock-badge { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.7); color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 4px; }

        /* CỘT PHẢI: GIỎ HÀNG & THANH TOÁN */
        .pos-right { width: 380px; background: var(--bg-card); display: flex; flex-direction: column; height: 100%; border-left: 1px solid var(--border); box-shadow: -5px 0 20px rgba(0,0,0,0.5); }
        
        .pos-cart-header { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.2); }
        .customer-select { display: flex; gap: 10px; }
        .customer-select input { flex: 1; background: transparent; border: none; border-bottom: 1px solid #333; color: #fff; padding: 5px; }
        
        .pos-cart-items { flex: 1; overflow-y: auto; padding: 10px; }
        .pos-item { display: flex; gap: 10px; padding: 10px; border-bottom: 1px dashed rgba(255,255,255,0.05); align-items: center; }
        .pos-item img { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; }
        .pos-item-info { flex: 1; }
        .pos-item-name { font-size: 11px; font-weight: 700; color: #fff; display: block; }
        .pos-item-meta { font-size: 10px; color: #888; }
        .pos-qty-ctrl { display: flex; align-items: center; gap: 5px; background: #000; border-radius: 4px; padding: 2px; }
        .pos-qty-btn { width: 20px; height: 20px; background: #333; border: none; color: #fff; border-radius: 2px; cursor: pointer; }
        .pos-qty-val { width: 25px; text-align: center; font-size: 11px; background: transparent; border: none; color: #fff; }

        .pos-footer { padding: 20px; background: rgba(0,0,0,0.3); border-top: 1px solid rgba(255,255,255,0.05); }
        .pos-total-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: #aaa; }
        .pos-final-price { font-size: 24px; color: var(--gold); font-weight: 800; }
        
        .pos-btn-pay { width: 100%; background: var(--gold); border: none; padding: 15px; font-size: 16px; font-weight: 800; color: #000; border-radius: 6px; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        .pos-btn-pay:hover { background: #fff; }

        /* Modal chọn biến thể */
        #posVariantModal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; display: none; justify-content: center; align-items: center; }
        #posVariantModal.open { display: flex; }
        .pos-v-content { background: #1a1a1a; padding: 25px; border-radius: 8px; width: 400px; border: 1px solid var(--gold); }
        .pos-v-options { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .pos-v-btn { padding: 8px 15px; background: #333; border: 1px solid #444; color: #fff; cursor: pointer; border-radius: 4px; }
        .pos-v-btn.selected { background: var(--gold); color: #000; border-color: var(--gold); }
    </style>
</head>
<body>

    <div class="pos-layout">
        <div class="pos-left">
            <div class="pos-header">
                <div class="admin-logo" style="height: auto; border: none; justify-content: flex-start; font-size: 20px;">
                    MOON<span class="highlight">LIGHT</span> POS
                </div>
                <div class="user-info" style="padding: 0; background: none; border: none; text-align: right;">
                    <span id="staffName" style="color: #fff; font-size: 12px;">Nhân viên</span>
                    <a href="admin.html" style="font-size: 10px; color: #888; text-decoration: none;"> <i class="fas fa-arrow-left"></i> Về Dashboard</a>
                </div>
            </div>

            <div class="pos-search">
                <input type="text" id="posSearchInput" placeholder="Tìm tên sản phẩm..." oninput="searchPosProduct()">
                <i class="fas fa-search"></i>
            </div>

            <div style="margin-top: 20px;">
                <div class="pos-grid" id="posProductGrid">
                    </div>
            </div>
        </div>

        <div class="pos-right">
            <div class="pos-cart-header">
                <div class="customer-select">
                    <i class="fas fa-user" style="color: var(--gold); margin-top: 8px;"></i>
                    <input type="text" id="posCusName" placeholder="Tên khách hàng (Mặc định: Khách lẻ)">
                    <input type="text" id="posCusPhone" placeholder="SĐT" style="width: 100px;">
                </div>
            </div>

            <div class="pos-cart-items" id="posCartItems">
                </div>

            <div class="pos-footer">
                <div class="pos-total-row">
                    <span>Số lượng:</span>
                    <strong id="posTotalQty">0</strong>
                </div>
                <div class="pos-total-row" style="color: #fff;">
                    <span>Tổng tiền:</span>
                    <span class="pos-final-price" id="posTotalPrice">0₫</span>
                </div>
                
                <div style="margin-top: 15px; display: flex; gap: 10px;">
                    <label style="flex: 1; background: rgba(255,255,255,0.05); padding: 10px; text-align: center; border-radius: 4px; cursor: pointer;">
                        <input type="radio" name="posPayment" value="Tiền mặt" checked> Tiền mặt
                    </label>
                    <label style="flex: 1; background: rgba(255,255,255,0.05); padding: 10px; text-align: center; border-radius: 4px; cursor: pointer;">
                        <input type="radio" name="posPayment" value="Banking"> Banking
                    </label>
                </div>

                <button class="pos-btn-pay" onclick="processPosCheckout()">THANH TOÁN & IN</button>
            </div>
        </div>
    </div>

    <div id="posVariantModal">
        <div class="pos-v-content">
            <h3 style="color: var(--gold); margin-bottom: 15px;">Chọn phân loại</h3>
            <div id="posVariantContainer"></div>
            <div style="margin-top: 20px; text-align: right;">
                <button class="btn-cancel" onclick="closePosModal()" style="padding: 8px 20px;">Hủy</button>
                <button class="btn-confirm" onclick="confirmPosAddToCart()" style="padding: 8px 20px;">Thêm</button>
            </div>
        </div>
    </div>

    <script src="./js/staff.js"></script>
</body>
</html>
